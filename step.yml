title: MAD Android
summary: Inject MAD RASP into Android APK/AAB files
description: |
  Protect an Android APK or AAB using the MAD Android CLI.
website: https://madsecurity.com/
source:
  git: https://github.com/showmeyourhands/MAD.git
  commit: main
host_os_tags:
  - ubuntu
project_type_tags:
  - android
type_tags:
  - utility

inputs:
  - license_key:
      opts:
        title: MAD License Key
        summary: License key used by MAD CLI
        description: MAD license key.
        is_required: true
        is_sensitive: true
  - file:
      opts:
        title: Input APK/AAB
        summary: Path to the APK or AAB to protect
        description: Absolute or Bitrise path to the input APK/AAB.
        is_required: true
  - config:
      opts:
        title: MAD Config
        summary: Path to mad_config.xml
        description: Path to the MAD configuration XML.
        is_required: true
  - store_file:
      opts:
        title: Keystore
        summary: Path to the signing keystore
        description: Path to the Android signing keystore.
        is_required: true
  - store_password:
      opts:
        title: Keystore Password
        summary: Keystore password
        description: Password for the signing keystore.
        is_required: true
        is_sensitive: true
  - key_alias:
      opts:
        title: Key Alias
        summary: Signing key alias
        description: Alias of the signing key in the keystore.
        is_required: true
  - key_password:
      opts:
        title: Key Password
        summary: Signing key password
        description: Password for the signing key.
        is_required: true
        is_sensitive: true
  - output_file:
      opts:
        title: Output File
        summary: Optional output path
        description: Optional destination path. If empty, MAD output is detected or derived from the input filename.
        is_required: false
outputs:
  - MAD_OUTPUT_FILE:
      opts:
        title: MAD Output File
        summary: Path to the protected APK/AAB
        description: Path to the APK/AAB generated by MAD.
