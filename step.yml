title: MAD Android
summary: Inject MAD RASP into Android APK/AAB files
description: |
  Protect an Android APK or AAB using the MAD Android CLI.

  This Step does NOT download the MAD Android CLI from any URL. The CLI
  binary must already be present on the runner before this Step executes,
  pointed to by the `cli_path` input. Provide it through your own private
  distribution channel, for example:

  - A private Git repository checked out in an earlier Step (via SSH deploy
    key or access token)
  - A private artifact/package registry (e.g. Nexus, Artifactory, private
    npm/Maven registry) fetched in an earlier Step
  - A cache step that restores a previously downloaded CLI
  - A file bundled into a custom Bitrise stack/VM image

  This Step then executes the protection process and exposes the protected
  APK/AAB through MAD_OUTPUT_FILE.

website: https://www.mobileappdefense.com/
source_code_url: https://github.com/madmobileappdefense/MAD.git
support_url: https://github.com/madmobileappdefense/MAD/issues

host_os_tags:
  - ubuntu

project_type_tags:
  - android

type_tags:
  - security
  - utility

inputs:
  - license_key: ""
    opts:
      title: MAD License Key
      summary: License key used by MAD CLI.
      description: MAD license key.
      is_required: true
      is_sensitive: true

  - cli_path: ""
    opts:
      title: MAD CLI Path
      summary: Path to the MAD Android CLI binary (or a directory containing it).
      description: |
        Absolute path to the MAD Android CLI binary already present on the
        runner. Can also point to a directory containing architecture-specific
        binaries named `mad-android-cli-<version>-linux` /
        `mad-android-cli-<version>-arm64`, in which case the Step selects the
        correct one automatically.

        This Step does not download the CLI itself — make sure a previous
        Step (private repo checkout, artifact registry, cache restore, etc.)
        places the CLI at this path before this Step runs.
      is_required: true

  - file: ""
    opts:
      title: Input APK/AAB
      summary: Path to the APK or AAB to protect.
      description: Absolute or Bitrise path to the input APK/AAB.
      is_required: true

  - config: ""
    opts:
      title: MAD Config
      summary: Path to mad_config.xml.
      description: Path to the MAD configuration XML file.
      is_required: true

  - store_file: ""
    opts:
      title: Keystore
      summary: Path to the Android signing keystore.
      description: Path to the Android signing keystore used by MAD.
      is_required: true

  - store_password: ""
    opts:
      title: Keystore Password
      summary: Password for the Android keystore.
      description: Password used to access the Android signing keystore.
      is_required: true
      is_sensitive: true

  - key_alias: ""
    opts:
      title: Key Alias
      summary: Signing key alias.
      description: Alias of the signing key inside the Android keystore.
      is_required: true

  - key_password: ""
    opts:
      title: Key Password
      summary: Password for the signing key.
      description: Password of the signing key inside the Android keystore.
      is_required: true
      is_sensitive: true

  - output_file: ""
    opts:
      title: Output File
      summary: Optional path for the protected APK/AAB.
      description: |
        Optional output path. If empty, the Step automatically detects
        the APK/AAB generated by MAD.
      is_required: false

outputs:
  - MAD_OUTPUT_FILE: ""
    opts:
      title: MAD Output File
      summary: Path to the protected APK/AAB.
      description: |
        Absolute path to the APK/AAB protected by MAD.
